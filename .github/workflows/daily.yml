# ============================================================
# 轨道 A: 每日高频看板 (Daily Dashboard)
# 触发: 周一至周五 UTC 21:00 (北京时间次日 05:00, 美股收盘后)
# ============================================================

name: Daily Dashboard - Gold Tech Fed

on:
  schedule:
    # UTC 21:00 = 北京时间次日 05:00 (标准时间)
    # UTC 20:00 = 北京时间次日 04:00 (夏令时)
    # 覆盖美股收盘时间: 16:00 ET = 20:00/21:00 UTC
    - cron: "0 21 * * 1-5"   # 周一至周五

  # 允许手动触发 (用于测试)
  workflow_dispatch:
    inputs:
      force_send:
        description: "强制发送 (忽略工作日检查)?"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  daily-dashboard:
    name: Fetch & Send Daily Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Dashboard
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python daily_dashboard.py

      - name: Upload Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-dashboard-log
          path: data/daily_dashboard.log
          retention-days: 7
